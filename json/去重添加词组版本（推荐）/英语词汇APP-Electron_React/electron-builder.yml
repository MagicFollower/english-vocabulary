directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - resources/**
  - package.json
asar: true
electronVersion: 44.5.1
win:
  icon: electron/icon.ico
  target:
    - portable
    - nsis
    - dir
  artifactName: ${productName}_${arch}.${ext}
portable:
  artifactName: ${productName}_portable.${ext}
nsis:
  artifactName: ${productName}_setup.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
